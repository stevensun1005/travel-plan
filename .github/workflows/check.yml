name: Check skill and starter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/budget.test.mjs
      - run: node --check assets/starter/app.mjs
      - run: python scripts/create_trip.py /tmp/travel-plan-demo --demo
      - run: python scripts/validate_trip.py /tmp/travel-plan-demo
