<!doctype html>
<!-- travel-plan — https://github.com/stevensun1005/travel-plan
     Copyright 2026 Steven Sun (stevensun1005). SPDX-License-Identifier: Apache-2.0
     Shared calendar-subscribe relay for every travel-plan page.
     Artifacts and some in-app browsers only follow http(s) links, so a webcal:// link does nothing there.
     The trip page opens this https page instead: subscribe.html?ics=<https .ics URL>&t=<title>&lang=zh|en&c=<RRGGBB>
     and this page hands off to webcal:// so the system calendar asks to subscribe.
     Only https URLs whose path ends in .ics are accepted. -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>订阅日历 · travel-plan</title>
<style>:root{--ink:#1d1d24;--paper:#fbf7ee;--soft:#62626b;--accent:#D07D9C}@media (prefers-color-scheme:dark){:root{--ink:#f1efe8;--paper:#1c1c22;--soft:#b4b2ad}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 20px}h1{font-size:24px;line-height:1.3;margin:0 0 12px}p{margin:0 0 16px;color:var(--soft)}
.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:14px;border-radius:14px;margin:20px 0 12px}
.row{display:flex;gap:8px}input{flex:1;min-width:0;font:14px ui-monospace,monospace;padding:10px;border:1px solid var(--soft);border-radius:10px;background:transparent;color:var(--ink)}
button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--ink);background:transparent;color:var(--ink)}small{display:block;margin-top:28px}small a{color:var(--soft)}[hidden]{display:none}</style></head>
<body><main>
<h1 id="h1">📅</h1><p id="lead"></p>
<div id="ok"><a class="btn" id="go" href="#"></a><p id="retry"></p><p id="manual"></p>
<div class="row"><input id="u" readonly aria-label="ics"><button id="c" type="button"></button></div></div>
<p id="bad" hidden></p>
<small><a href="https://github.com/stevensun1005/travel-plan">travel-plan</a></small></main>
<script>
const q=new URLSearchParams(location.search),en=q.get('lang')==='en',$=id=>document.getElementById(id);
const T=en?{doc:'Subscribe to calendar',h1:t=>t?`Subscribe to “${t}”`:'Subscribe to this trip',lead:'Calendar should open now. Tap “Subscribe” and the trip gets a calendar of its own, which you can hide in one tap and which updates when the plan changes.',btn:'Open Calendar to subscribe',retry:'If Calendar opened without asking, come back and tap the button again.',manual:'Still nothing? Add it by hand: on iPhone, Settings → Calendar → Accounts → Add Account → Other → Add Subscribed Calendar, then paste this address:',copy:'Copy address',copied:'Copied',bad:'This link has no valid calendar address. Go back to the trip page and tap the button again.'}
:{doc:'订阅日历',h1:t=>t?`订阅「${t}」`:'订阅这份行程',lead:'马上会打开日历，点「订阅」就好。整个行程会单独成一个日历，可以一键隐藏，行程改了会自动更新。',btn:'打开日历订阅',retry:'如果只打开了日历、没弹出订阅，回到这里再点一次上面的按钮。',manual:'还是不行的话可以手动加：iPhone「设置 → 日历 → 账户 → 添加账户 → 其他 → 添加已订阅的日历」，粘贴这个地址：',copy:'复制地址',copied:'已复制',bad:'这个链接里没有有效的日历地址，回到行程页面重新点一次。'};
document.documentElement.lang=en?'en':'zh-CN';
let ics=null;try{const u=new URL(q.get('ics')||'');if(u.protocol==='https:'&&/\.ics$/i.test(u.pathname))ics=u.href;}catch{}
const title=(q.get('t')||'').slice(0,120),color=q.get('c')||'';
if(/^[0-9a-f]{6}$/i.test(color))document.documentElement.style.setProperty('--accent','#'+color);
document.title=`${title?title+' · ':''}${T.doc}`;$('h1').textContent=`📅 ${T.h1(title)}`;
if(!ics){$('ok').hidden=true;$('lead').hidden=true;$('bad').hidden=false;$('bad').textContent=T.bad;}
else{
  const webcal=ics.replace(/^https:/,'webcal:');
  $('lead').textContent=T.lead;$('go').href=webcal;$('go').textContent=T.btn;$('retry').textContent=T.retry;$('manual').textContent=T.manual;
  $('u').value=ics;$('c').textContent=T.copy;
  $('c').onclick=async()=>{try{await navigator.clipboard.writeText(ics);}catch{$('u').select();document.execCommand('copy');}$('c').textContent=T.copied;};
  setTimeout(()=>{location.href=webcal;},400);
}
</script></body></html>
